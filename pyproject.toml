[project]
name = "cvf-paper-stamper"
version = "0.1.0"
description = "CVF paper stamper"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cyclopts>=4.11.2",
    "gspread>=6.2.1",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "nameparser>=1.1.3",
    "pandas>=3.0.0",
    "pdf2image>=1.17.0",
    "pikepdf>=10.3.0",
    "pillow>=12.1.0",
    "pydantic>=2.12.5",
    "pymupdf>=1.26.7",
    "pypdfium2>=5.8.0",
    "reportlab>=4.4.9",
    "scikit-image>=0.26.0",
    "svglib>=1.6.0",
    "tqdm>=4.67.3",
    "unidecode>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
cvf-paper-stamper = "cvf.proceedings_stamper.__main__:app"

[tool.uv.build-backend]
module-name = ["cvf.proceedings_stamper"]
